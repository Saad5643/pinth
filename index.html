<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Hand Particles (Debug Mode)</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050505; font-family: sans-serif; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        #video-container {
            position: absolute; bottom: 20px; left: 20px; z-index: 2;
            width: 200px; height: 150px; border-radius: 10px; overflow: hidden;
            border: 2px solid rgba(255,255,255,0.3); transform: scaleX(-1);
            background: #222;
        }
        video { width: 100%; height: 100%; object-fit: cover; }
        
        /* Loading & Error Screen */
        #status-screen {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 10; text-align: center; width: 80%; max-width: 600px;
            background: rgba(0,0,0,0.8); padding: 20px; border-radius: 10px; border: 1px solid #333;
        }
        h1 { color: #00ff88; margin: 0 0 10px 0; font-size: 24px; }
        p { color: #ccc; margin-bottom: 20px; }
        #error-log {
            color: #ff4444; font-family: monospace; background: #220000;
            padding: 10px; border-radius: 5px; text-align: left; display: none;
            white-space: pre-wrap; font-size: 12px;
        }

        #ui {
            position: absolute; top: 20px; left: 20px; color: white; z-index: 2;
            pointer-events: none; display: none; /* Hidden until loaded */
        }
        .instruction { font-size: 14px; color: #aaa; margin-top: 5px; }
        b { color: #00ff88; }
    </style>
</head>
<body>

    <div id="status-screen">
        <h1 id="status-title">Initializing...</h1>
        <p id="status-msg">Please allow camera access when prompted.</p>
        <div id="error-log"></div>
    </div>
    
    <div id="ui">
        <h2>Particle Controller</h2>
        <div class="instruction">🖐 <b>Move Hand</b> to control position</div>
        <div class="instruction">✊ <b>Close Fist</b> to collapse / 🖐 <b>Open</b> to expand</div>
        <div class="instruction">👌 <b>Pinch</b> to change shape</div>
        <div class="instruction" id="current-shape">Shape: Sphere</div>
    </div>

    <div id="video-container">
        <video id="webcam" autoplay playsinline muted></video>
    </div>
    <div id="canvas-container"></div>

    <script type="module">
        import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
        import { FilesetResolver, HandLandmarker } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0';

        // --- Logger Helper ---
        const statusTitle = document.getElementById('status-title');
        const statusMsg = document.getElementById('status-msg');
        const errorLog = document.getElementById('error-log');
        
        function logError(err) {
            statusTitle.innerText = "Error Occurred";
            statusTitle.style.color = "#ff4444";
            statusMsg.innerText = "See details below. Ensure you are using a Local Server (localhost), not file://";
            errorLog.style.display = "block";
            errorLog.innerText += `\n> ${err}`;
            console.error(err);
        }

        function updateStatus(msg) {
            statusMsg.innerText = msg;
        }

        // --- Configuration ---
        const CONFIG = {
            particleCount: 15000,
            colorBase: new THREE.Color(0x00ffff),
            colorAlt: new THREE.Color(0xff0088),
            lerpSpeed: 0.08, 
            pinchThreshold: 0.05
        };

        let scene, camera, renderer, particles, geometry, material;
        let handLandmarker;
        let video;
        let lastVideoTime = -1;
        let isPinching = false;
        let shapeIndex = 0;
        let currentPositions = [];
        let targetPositions = [];
        let handCenter = new THREE.Vector3(0, 0, 0);
        let handOpenness = 1.0;
        const shapes = ['Sphere', 'Heart', 'Saturn', 'Flower', 'Torus'];

        async function init() {
            try {
                // Check if running from file system
                if (window.location.protocol === 'file:') {
                    throw new Error("You are running via 'file://'. This blocks Camera/AI. Please use a Local Server (e.g., VS Code Live Server).");
                }

                updateStatus("Setting up 3D Environment...");
                setup3D();
                
                updateStatus("Generating Particles...");
                generateParticles();
                setShape('Sphere');

                updateStatus("Requesting Camera Access...");
                await setupCamera();

                updateStatus("Loading AI Model (this may take a moment)...");
                await setupAI();

                // Success!
                document.getElementById('status-screen').style.display = 'none';
                document.getElementById('ui').style.display = 'block';
                animate();

            } catch (error) {
                logError(error);
            }
        }

        function setup3D() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 30;
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        function generateParticles() {
            geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(CONFIG.particleCount * 3);
            const colors = new Float32Array(CONFIG.particleCount * 3);
            for (let i = 0; i < CONFIG.particleCount; i++) {
                positions[i*3] = (Math.random() - 0.5) * 50;
                positions[i*3+1] = (Math.random() - 0.5) * 50;
                positions[i*3+2] = (Math.random() - 0.5) * 50;
                currentPositions.push(new THREE.Vector3(positions[i*3], positions[i*3+1], positions[i*3+2]));
                targetPositions.push(new THREE.Vector3(0,0,0));
            }
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            material = new THREE.PointsMaterial({
                size: 0.15, vertexColors: true, blending: THREE.AdditiveBlending,
                depthWrite: false, transparent: true, opacity: 0.8
            });
            particles = new THREE.Points(geometry, material);
            scene.add(particles);
        }

        function setShape(type) {
            document.getElementById('current-shape').innerText = `Shape: ${type}`;
            const count = CONFIG.particleCount;
            for (let i = 0; i < count; i++) {
                let x, y, z;
                if (type === 'Sphere') {
                    const r = 10;
                    const theta = Math.random() * Math.PI * 2;
                    const phi = Math.acos((Math.random() * 2) - 1);
                    x = r * Math.sin(phi) * Math.cos(theta);
                    y = r * Math.sin(phi) * Math.sin(theta);
                    z = r * Math.cos(phi);
                } else if (type === 'Heart') {
                    const phi = Math.random() * Math.PI * 2;
                    const theta = Math.random() * Math.PI;
                    x = 16 * Math.pow(Math.sin(phi), 3);
                    y = 13 * Math.cos(phi) - 5 * Math.cos(2*phi) - 2 * Math.cos(3*phi) - Math.cos(4*phi);
                    z = 4 * Math.cos(theta) * Math.sin(phi);
                    x *= 0.8; y *= 0.8; z *= 0.8;
                } else if (type === 'Saturn') {
                    const isRing = Math.random() > 0.4;
                    if (isRing) {
                        const r = 14 + Math.random() * 6;
                        const theta = Math.random() * Math.PI * 2;
                        x = r * Math.cos(theta); z = r * Math.sin(theta); y = (Math.random() - 0.5) * 0.5;
                    } else {
                        const r = 8;
                        const theta = Math.random() * Math.PI * 2;
                        const phi = Math.acos((Math.random() * 2) - 1);
                        x = r * Math.sin(phi) * Math.cos(theta); y = r * Math.sin(phi) * Math.sin(theta); z = r * Math.cos(phi);
                    }
                } else if (type === 'Flower') {
                    const theta = Math.random() * Math.PI * 2;
                    const k = 4;
                    const r = 15 * Math.cos(k * theta);
                    x = r * Math.cos(theta); y = r * Math.sin(theta); z = (Math.random() - 0.5) * 5;
                } else if (type === 'Torus') {
                    const u = Math.random() * Math.PI * 2; const v = Math.random() * Math.PI * 2;
                    const R = 12; const r = 4;
                    x = (R + r * Math.cos(v)) * Math.cos(u); y = (R + r * Math.cos(v)) * Math.sin(u); z = r * Math.sin(v);
                }
                targetPositions[i].set(x, y, z);
            }
        }

        async function setupCamera() {
            video = document.getElementById('webcam');
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                throw new Error("Browser API navigator.mediaDevices.getUserMedia not available.");
            }
            const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
            video.srcObject = stream;
            return new Promise((resolve) => {
                video.onloadedmetadata = () => { video.play(); resolve(); };
            });
        }

        async function setupAI() {
            // Explicitly load WASM from a known reliable path
            const vision = await FilesetResolver.forVisionTasks(
                "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0/wasm"
            );
            handLandmarker = await HandLandmarker.createFromOptions(vision, {
                baseOptions: {
                    modelAssetPath: `https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task`,
                    delegate: "GPU"
                },
                runningMode: "VIDEO",
                numHands: 1
            });
        }

        function detectGestures(results) {
            if (results.landmarks && results.landmarks.length > 0) {
                const landmarks = results.landmarks[0];
                const x = (0.5 - landmarks[9].x) * 30; 
                const y = (0.5 - landmarks[9].y) * 20;
                handCenter.set(x, y, 0);

                const thumb = landmarks[4];
                const index = landmarks[8];
                const distance = Math.hypot(thumb.x - index.x, thumb.y - index.y);

                if (distance < CONFIG.pinchThreshold && !isPinching) {
                    isPinching = true;
                    shapeIndex = (shapeIndex + 1) % shapes.length;
                    setShape(shapes[shapeIndex]);
                    material.color.setHex(0xffffff);
                    setTimeout(() => material.color.setHex(0xffffff), 100);
                } else if (distance > CONFIG.pinchThreshold * 1.5) {
                    isPinching = false;
                }

                const wrist = landmarks[0];
                const middleTip = landmarks[12];
                const handSize = Math.hypot(wrist.x - middleTip.x, wrist.y - middleTip.y);
                handOpenness = THREE.MathUtils.mapLinear(handSize, 0.2, 0.5, 0.5, 2.0);
                handOpenness = THREE.MathUtils.clamp(handOpenness, 0.5, 3.0);
            } else {
                handCenter.lerp(new THREE.Vector3(0,0,0), 0.05);
                handOpenness = THREE.MathUtils.lerp(handOpenness, 1.0, 0.05);
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            if (video && video.readyState >= 2) {
                if(handLandmarker) {
                    const results = handLandmarker.detectForVideo(video, performance.now());
                    detectGestures(results);
                }
            }

            const positions = geometry.attributes.position.array;
            const colors = geometry.attributes.color.array;
            const time = Date.now() * 0.001;

            particles.position.lerp(handCenter, 0.05);
            particles.rotation.y += 0.002;
            particles.rotation.z += 0.001;

            for (let i = 0; i < CONFIG.particleCount; i++) {
                const idx = i * 3;
                currentPositions[i].lerp(targetPositions[i], CONFIG.lerpSpeed);
                
                let px = currentPositions[i].x * handOpenness;
                let py = currentPositions[i].y * handOpenness;
                let pz = currentPositions[i].z * handOpenness;
                
                px += Math.sin(time + i) * 0.05;
                py += Math.cos(time + i * 0.5) * 0.05;

                positions[idx] = px; positions[idx+1] = py; positions[idx+2] = pz;

                const dist = Math.sqrt(px*px + py*py + pz*pz);
                const colorRatio = Math.min(dist / 20, 1);
                const r = THREE.MathUtils.lerp(CONFIG.colorBase.r, CONFIG.colorAlt.r, colorRatio);
                const g = THREE.MathUtils.lerp(CONFIG.colorBase.g, CONFIG.colorAlt.g, colorRatio);
                const b = THREE.MathUtils.lerp(CONFIG.colorBase.b, CONFIG.colorAlt.b, colorRatio);
                colors[idx] = r; colors[idx+1] = g; colors[idx+2] = b;
            }
            geometry.attributes.position.needsUpdate = true;
            geometry.attributes.color.needsUpdate = true;
            material.color.lerp(new THREE.Color(1, 1, 1), 0.1); 
            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
